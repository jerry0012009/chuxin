name: chuxin-local

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chuxin
      MYSQL_USER: chuxin
      MYSQL_PASSWORD: chuxin-local-db
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24

  backend:
    build:
      context: ./backend
      dockerfile: ../deploy/local/backend.Dockerfile
    environment:
      DB_URL: jdbc:mysql://db:3306/chuxin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: chuxin
      DB_PASSWORD: chuxin-local-db
      APP_OPTIONAL_ENDPOINTS_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 24

  seed:
    build:
      context: .
      dockerfile: deploy/local/seed.Dockerfile
    environment:
      CHUXIN_BASE_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: ../deploy/local/web.Dockerfile
    ports:
      - "127.0.0.1:${CHUXIN_LOCAL_PORT:-18090}:80"
    volumes:
      - ./deploy/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  db-data:
