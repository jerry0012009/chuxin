limit_req_zone $binary_remote_addr zone=chuxin_auth:5m rate=5r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chuxin.31-220-80-196.sslip.io;
    ssl_certificate /etc/letsencrypt/live/chuxin.31-220-80-196.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chuxin.31-220-80-196.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /opt/chuxin/current/web;
    index index.html;
    client_max_body_size 60m;
    access_log /var/log/nginx/chuxin-access.log;
    error_log /var/log/nginx/chuxin-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / { return 302 /chuxin-vue/; }
    location = /chuxin-vue { return 308 /chuxin-vue/; }

    location ~ ^/chuxin-vue/api/auth/(login|signup)$ {
        limit_req zone=chuxin_auth burst=15 nodelay;
        limit_req_status 429;
        rewrite ^/chuxin-vue(/api/.*)$ $1 break;
        include /etc/chuxin/nginx-backend.conf;
        proxy_pass http://127.0.0.1:18180;
    }

    location /chuxin-vue/api/ {
        include /etc/chuxin/nginx-backend.conf;
        proxy_pass http://127.0.0.1:18180/api/;
    }

    # File mutations and AI integrations are not part of the public trial.
    location ^~ /chuxin-vue/api/storage/ { return 404; }
    location ^~ /chuxin-vue/api/functions/ { return 404; }
    location = /chuxin-vue/api/rpc/verify_and_use_code { return 404; }

    location ^~ /chuxin-vue/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /chuxin-vue/ {
        try_files $uri $uri/ /chuxin-vue/index.html;
    }

    location / { return 404; }
}
