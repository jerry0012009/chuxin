location = /chuxin-vue {
    return 308 /chuxin-vue/;
}

location ~ ^/chuxin-vue/api/auth/(login|signup)$ {
    limit_req zone=chuxin_auth burst=15 nodelay;
    limit_req_status 429;
    rewrite ^/chuxin-vue(/api/.*)$ $1 break;
    include /etc/chuxin/nginx-backend.conf;
    proxy_pass http://127.0.0.1:18180;
}

location ^~ /chuxin-vue/api/storage/ { return 404; }
location ^~ /chuxin-vue/api/functions/ { return 404; }
location = /chuxin-vue/api/rpc/verify_and_use_code { return 404; }

location /chuxin-vue/api/ {
    include /etc/chuxin/nginx-backend.conf;
    proxy_pass http://127.0.0.1:18180/api/;
}

location ^~ /chuxin-vue/assets/ {
    root /opt/chuxin/current/web;
    expires 1y;
    try_files $uri =404;
}

location /chuxin-vue/ {
    root /opt/chuxin/current/web;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files $uri $uri/ /chuxin-vue/index.html;
}
