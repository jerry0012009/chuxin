name: chuxin
services:
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    env_file: /etc/chuxin/mysql.env
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --innodb-buffer-pool-size=256M]
    ports:
      - "127.0.0.1:13316:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, "127.0.0.1", --silent]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
