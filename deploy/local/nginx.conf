server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = / { return 302 /chuxin-vue/; }
    location = /chuxin-vue { return 308 /chuxin-vue/; }

    location /chuxin-vue/api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }

    location /chuxin-vue/assets/ {
        try_files $uri =404;
    }

    location /chuxin-vue/ {
        try_files $uri $uri/ /chuxin-vue/index.html;
    }
}
